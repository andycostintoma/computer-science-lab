<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
  <title id="title">Special-purpose versus general-purpose computing</title>
  <desc id="desc">Special-purpose machines solve one task, while general-purpose machines run many operation sequences.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .panel { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 14; }
    .chip { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 10; }
    .engine { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 10; }
    .label { font-size: 20px; font-weight: 700; }
    .note { font-size: 15px; }
    .arrow { stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
  </defs>
  <rect x="40" y="40" width="300" height="240" class="panel" />
  <text x="190" y="78" text-anchor="middle" class="label">Special-purpose</text>
  <rect x="95" y="115" width="190" height="52" class="chip" />
  <text x="190" y="147" text-anchor="middle" class="note">One machine</text>
  <line x1="190" y1="174" x2="190" y2="205" class="arrow" />
  <rect x="95" y="212" width="190" height="42" class="chip" />
  <text x="190" y="239" text-anchor="middle" class="note">One class of task</text>
  <rect x="420" y="40" width="300" height="240" class="panel" />
  <text x="570" y="78" text-anchor="middle" class="label">General-purpose</text>
  <rect x="475" y="105" width="190" height="48" class="engine" />
  <text x="570" y="135" text-anchor="middle" class="note">Data + operations</text>
  <line x1="570" y1="160" x2="570" y2="188" class="arrow" />
  <rect x="475" y="195" width="190" height="48" class="engine" />
  <text x="570" y="225" text-anchor="middle" class="note">Many possible tasks</text>
  <text x="80" y="304" class="note">Difference Engine: table-oriented calculation</text>
  <text x="435" y="304" class="note">Analytical Engine: programmable sequence</text>
</svg>
