<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">Punch card tabulation flow</title>
  <desc id="desc">Punch cards encode data, pins pass through holes, circuits complete, and counters increment.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
    .card { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 8; }
    .circuit { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 8; }
    .counter { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 8; }
    .label { font-size: 17px; font-weight: 700; }
    .note { font-size: 14px; }
    .arrow { stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
  </defs>
  <rect x="35" y="70" width="150" height="110" class="card" />
  <text x="110" y="105" text-anchor="middle" class="label">Punch card</text>
  <circle cx="75" cy="135" r="8" fill="#c2410c" /><circle cx="110" cy="135" r="8" fill="#c2410c" /><circle cx="145" cy="135" r="8" fill="#c2410c" />
  <text x="110" y="165" text-anchor="middle" class="note">holes encode data</text>
  <line x1="195" y1="125" x2="250" y2="125" class="arrow" />
  <rect x="260" y="70" width="150" height="110" class="box" />
  <text x="335" y="105" text-anchor="middle" class="label">Metal pins</text>
  <text x="335" y="132" text-anchor="middle" class="note">pass through</text>
  <text x="335" y="154" text-anchor="middle" class="note">punched positions</text>
  <line x1="420" y1="125" x2="475" y2="125" class="arrow" />
  <rect x="485" y="70" width="150" height="110" class="circuit" />
  <text x="560" y="105" text-anchor="middle" class="label">Circuit closes</text>
  <text x="560" y="135" text-anchor="middle" class="note">current powers</text>
  <text x="560" y="157" text-anchor="middle" class="note">a motor</text>
  <line x1="560" y1="188" x2="560" y2="220" class="arrow" />
  <rect x="485" y="218" width="150" height="34" class="counter" />
  <text x="560" y="241" text-anchor="middle" class="note">counter increments</text>
</svg>
