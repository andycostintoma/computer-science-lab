<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Computing abstraction layers</title>
  <desc id="desc">A stack from simple binary states up to applications and society.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .box { fill: #f5f7fb; stroke: #344767; stroke-width: 2; rx: 12; }
    .top { fill: #d9ecff; }
    .mid { fill: #e8f5e9; }
    .low { fill: #fff3d6; }
    .arrow { stroke: #344767; stroke-width: 2.5; marker-end: url(#arrow); }
    .label { font-size: 20px; font-weight: 700; }
    .note { font-size: 15px; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#344767" />
    </marker>
  </defs>
  <rect x="230" y="30" width="300" height="52" class="box top" />
  <text x="380" y="62" text-anchor="middle" class="label">Applications &amp; Society</text>
  <rect x="230" y="96" width="300" height="52" class="box top" />
  <text x="380" y="128" text-anchor="middle" class="label">Internet &amp; Operating Systems</text>
  <rect x="230" y="162" width="300" height="52" class="box mid" />
  <text x="380" y="194" text-anchor="middle" class="label">Programs &amp; CPUs</text>
  <rect x="230" y="228" width="300" height="52" class="box mid" />
  <text x="380" y="260" text-anchor="middle" class="label">Logic Units &amp; Gates</text>
  <rect x="230" y="294" width="300" height="52" class="box low" />
  <text x="380" y="326" text-anchor="middle" class="label">Bits: 1s and 0s</text>
  <line x1="380" y1="286" x2="380" y2="282" class="arrow" />
  <line x1="380" y1="220" x2="380" y2="216" class="arrow" />
  <line x1="380" y1="154" x2="380" y2="150" class="arrow" />
  <line x1="380" y1="88" x2="380" y2="84" class="arrow" />
  <text x="52" y="178" class="note">Complex behavior emerges</text>
  <text x="52" y="200" class="note">from simple operations</text>
  <text x="592" y="178" class="note">Each layer hides detail</text>
  <text x="592" y="200" class="note">but depends on layers below</text>
</svg>
