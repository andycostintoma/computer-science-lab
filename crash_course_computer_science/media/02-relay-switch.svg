<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Relay switching mechanism</title>
  <desc id="desc">A control coil pulls a metal arm to close a circuit.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .wire { stroke: #334155; stroke-width: 4; fill: none; }
    .coil { stroke: #2563eb; stroke-width: 4; fill: none; }
    .arm { stroke: #92400e; stroke-width: 8; stroke-linecap: round; }
    .contact { fill: #334155; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
    .label { font-size: 18px; font-weight: 700; }
    .note { font-size: 14px; }
    .arrow { stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
  </defs>
  <rect x="45" y="45" width="670" height="210" class="box" />
  <text x="145" y="82" text-anchor="middle" class="label">Control circuit</text>
  <path d="M95 150 C115 115, 135 185, 155 150 S195 115, 215 150 S255 185, 275 150" class="coil" />
  <line x1="65" y1="150" x2="95" y2="150" class="wire" />
  <line x1="275" y1="150" x2="315" y2="150" class="wire" />
  <text x="190" y="205" text-anchor="middle" class="note">current in coil creates magnetic field</text>
  <line x1="330" y1="150" x2="410" y2="120" class="arrow" />
  <text x="405" y="102" text-anchor="middle" class="note">pulls arm</text>
  <line x1="450" y1="110" x2="560" y2="150" class="arm" />
  <circle cx="450" cy="110" r="9" class="contact" />
  <circle cx="585" cy="150" r="9" class="contact" />
  <line x1="585" y1="150" x2="680" y2="150" class="wire" />
  <text x="590" y="82" text-anchor="middle" class="label">Controlled circuit</text>
  <text x="585" y="205" text-anchor="middle" class="note">closed arm lets current flow</text>
</svg>
