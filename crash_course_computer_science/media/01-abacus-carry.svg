<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Abacus carry example</title>
  <desc id="desc">A decimal abacus carry turns ten ones into one ten.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .rail { stroke: #344767; stroke-width: 4; }
    .bead { fill: #f59e0b; stroke: #92400e; stroke-width: 2; }
    .bead2 { fill: #60a5fa; stroke: #1d4ed8; stroke-width: 2; }
    .label { font-size: 18px; font-weight: 700; }
    .note { font-size: 15px; }
    .arrow { stroke: #344767; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#344767" />
    </marker>
  </defs>
  <text x="80" y="42" class="label">Before carry: 12 ones attempted</text>
  <line x1="80" y1="90" x2="330" y2="90" class="rail" />
  <line x1="80" y1="150" x2="330" y2="150" class="rail" />
  <text x="24" y="96" class="note">tens</text>
  <text x="24" y="156" class="note">ones</text>
  <circle cx="110" cy="150" r="13" class="bead" /><circle cx="138" cy="150" r="13" class="bead" />
  <circle cx="166" cy="150" r="13" class="bead" /><circle cx="194" cy="150" r="13" class="bead" />
  <circle cx="222" cy="150" r="13" class="bead" /><circle cx="250" cy="150" r="13" class="bead" />
  <circle cx="278" cy="150" r="13" class="bead" /><circle cx="306" cy="150" r="13" class="bead" />
  <text x="135" y="205" class="note">overflow on ones row</text>
  <line x1="365" y1="150" x2="420" y2="150" class="arrow" />
  <text x="470" y="42" class="label">After carry: 1 ten + 2 ones</text>
  <line x1="470" y1="90" x2="720" y2="90" class="rail" />
  <line x1="470" y1="150" x2="720" y2="150" class="rail" />
  <text x="420" y="96" class="note">tens</text>
  <text x="420" y="156" class="note">ones</text>
  <circle cx="500" cy="90" r="13" class="bead2" />
  <circle cx="500" cy="150" r="13" class="bead" /><circle cx="528" cy="150" r="13" class="bead" />
  <text x="520" y="205" class="note">same value, compact representation</text>
</svg>
