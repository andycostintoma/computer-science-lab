<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" role="img" aria-labelledby="title desc">
  <title id="title">Colossus and ENIAC comparison</title>
  <desc id="desc">Colossus was programmable electronic computing for code breaking; ENIAC was general-purpose programmable electronic computing.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .panel { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 14; }
    .colossus { fill: #eef2ff; }
    .eniac { fill: #ecfdf5; }
    .label { font-size: 22px; font-weight: 700; }
    .note { font-size: 15px; }
    .tag { font-size: 14px; font-weight: 700; fill: #334155; }
    .arrow { stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
  </defs>
  <rect x="45" y="55" width="310" height="220" class="panel colossus" />
  <text x="200" y="92" text-anchor="middle" class="label">Colossus Mk 1</text>
  <text x="200" y="125" text-anchor="middle" class="tag">1943, Bletchley Park</text>
  <text x="200" y="160" text-anchor="middle" class="note">programmable electronic computer</text>
  <text x="200" y="188" text-anchor="middle" class="note">configured with plugboards</text>
  <text x="200" y="216" text-anchor="middle" class="note">built for code-breaking</text>
  <text x="200" y="244" text-anchor="middle" class="note">about 1,600 vacuum tubes</text>
  <line x1="368" y1="165" x2="452" y2="165" class="arrow" />
  <rect x="465" y="55" width="310" height="220" class="panel eniac" />
  <text x="620" y="92" text-anchor="middle" class="label">ENIAC</text>
  <text x="620" y="125" text-anchor="middle" class="tag">1946, University of Pennsylvania</text>
  <text x="620" y="160" text-anchor="middle" class="note">general-purpose programmable</text>
  <text x="620" y="188" text-anchor="middle" class="note">electronic computer</text>
  <text x="620" y="216" text-anchor="middle" class="note">about 5,000 additions / second</text>
  <text x="620" y="244" text-anchor="middle" class="note">powerful but failure-prone</text>
  <text x="260" y="310" text-anchor="middle" class="note">From electronic specialization</text>
  <text x="560" y="310" text-anchor="middle" class="note">to electronic general-purpose computation</text>
</svg>
