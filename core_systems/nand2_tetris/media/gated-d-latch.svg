<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Gated D latch</title>
  <desc id="desc">A gated D latch converts D and enable into safe S and R inputs for an SR latch using S equals enable AND D and R equals enable AND not D.</desc>
  <rect width="1040" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111111"/>
    </marker>
  </defs>
  <text x="520" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111111">Gated D Latch</text>

  <line x1="80" y1="190" x2="250" y2="190" stroke="#111111" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="55" y="198" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111111">D</text>

  <circle cx="175" cy="310" r="18" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="175" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111111">!</text>
  <path d="M150 190 L150 310 L157 310" fill="none" stroke="#111111" stroke-width="4"/>
  <line x1="193" y1="310" x2="250" y2="310" stroke="#111111" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="207" y="342" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111111">not D</text>

  <line x1="80" y1="420" x2="330" y2="420" stroke="#111111" stroke-width="4"/>
  <text x="32" y="428" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111111">enable</text>
  <path d="M330 420 L330 220" fill="none" stroke="#111111" stroke-width="4"/>
  <path d="M330 420 L330 340" fill="none" stroke="#111111" stroke-width="4"/>

  <rect x="250" y="150" width="180" height="90" rx="14" fill="#f2f6ff" stroke="#111111" stroke-width="3"/>
  <text x="340" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111111">AND</text>
  <line x1="330" y1="220" x2="330" y2="240" stroke="#111111" stroke-width="4"/>

  <rect x="250" y="270" width="180" height="90" rx="14" fill="#fff7e6" stroke="#111111" stroke-width="3"/>
  <text x="340" y="323" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111111">AND</text>
  <line x1="330" y1="340" x2="330" y2="360" stroke="#111111" stroke-width="4"/>

  <line x1="430" y1="195" x2="565" y2="195" stroke="#111111" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="482" y="176" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111111">S</text>
  <line x1="430" y1="315" x2="565" y2="315" stroke="#111111" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="482" y="346" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111111">R</text>

  <rect x="565" y="135" width="250" height="240" rx="18" fill="#eefaf1" stroke="#111111" stroke-width="3"/>
  <text x="690" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111111">SR latch</text>
  <text x="690" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">stores one bit</text>

  <line x1="815" y1="255" x2="965" y2="255" stroke="#111111" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="980" y="263" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111111">Q</text>

  <text x="520" y="510" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111111">S = enable AND D; R = enable AND not D</text>
</svg>
