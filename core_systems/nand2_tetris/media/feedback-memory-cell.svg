<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Feedback memory cell</title>
  <desc id="desc">A simple feedback loop where an output is routed back as a future input, allowing a previous value to affect the next output.</desc>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111111"/>
    </marker>
  </defs>
  <text x="450" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111111">Feedback Creates State</text>
  <rect x="330" y="130" width="240" height="120" rx="16" fill="#f2f6ff" stroke="#111111" stroke-width="3"/>
  <text x="450" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111111">logic</text>
  <text x="450" y="216" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111111">uses current input + old output</text>
  <line x1="110" y1="190" x2="320" y2="190" stroke="#111111" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="112" y="166" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111111">external input</text>
  <line x1="570" y1="190" x2="790" y2="190" stroke="#111111" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="708" y="166" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111111">Q output</text>
  <path d="M690 190 L690 330 L450 330 L450 260" fill="none" stroke="#111111" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="548" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111111">feedback: old Q returns</text>
</svg>
